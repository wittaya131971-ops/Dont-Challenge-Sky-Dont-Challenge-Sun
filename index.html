<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chemistry Periodic Table Master - 7 Modes Edition</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --accent-color: #58a6ff;
            --correct-color: #2ea043;
            --wrong-color: #da3633;
            --text-color: #c9d1d9;
            --grid-border: #30363d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }

        header {
            text-align: center;
            margin-bottom: 15px;
            width: 100%;
            max-width: 1200px;
        }

        h1 {
            color: var(--accent-color);
            font-size: 1.8rem;
            margin-bottom: 8px;
        }

        /* Status Bar */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            padding: 12px 20px;
            border-radius: 12px;
            width: 100%;
            max-width: 1200px;
            margin-bottom: 15px;
            border: 1px solid var(--grid-border);
        }

        .hearts {
            font-size: 1.4rem;
            letter-spacing: 2px;
        }

        .score-board {
            font-size: 1.1rem;
            font-weight: bold;
            color: #f0883e;
        }

        /* Mode Selector Nav */
        .mode-nav {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            margin-bottom: 20px;
            width: 100%;
            max-width: 1200px;
        }

        .mode-btn {
            background: var(--card-bg);
            color: var(--text-color);
            border: 1px solid var(--grid-border);
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s ease;
        }

        .mode-btn:hover, .mode-btn.active {
            background: var(--accent-color);
            color: #000;
            font-weight: bold;
            border-color: var(--accent-color);
        }

        /* Game Main View Container */
        .game-container {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            width: 100%;
            max-width: 1200px;
            border: 1px solid var(--grid-border);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 400px;
        }

        .question-box {
            font-size: 1.2rem;
            text-align: center;
            margin-bottom: 20px;
            color: #ffffff;
            line-height: 1.5;
        }

        .input-area {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            width: 100%;
            max-width: 400px;
        }

        input[type="text"] {
            flex: 1;
            padding: 10px 15px;
            border-radius: 8px;
            border: 1px solid var(--grid-border);
            background: #0d1117;
            color: #fff;
            font-size: 1rem;
            text-align: center;
        }

        button.submit-btn {
            padding: 10px 20px;
            background: var(--accent-color);
            color: #000;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            width: 100%;
            max-width: 600px;
            margin-top: 15px;
        }

        .option-card {
            background: #21262d;
            border: 1px solid var(--grid-border);
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            font-size: 1.2rem;
            transition: all 0.2s ease;
        }

        .option-card:hover {
            border-color: var(--accent-color);
            transform: translateY(-2px);
        }

        /* Periodic Table Grid Layout for Mode 1 */
        .table-wrapper {
            width: 100%;
            overflow-x: auto;
            padding-bottom: 10px;
        }

        .ptable-grid {
            display: grid;
            grid-template-columns: repeat(18, minmax(36px, 1fr));
            gap: 3px;
            min-width: 750px;
            margin: 0 auto;
        }

        .grid-cell {
            aspect-ratio: 1;
            background: #21262d;
            border: 1px solid #30363d;
            border-radius: 4px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            cursor: pointer;
            user-select: none;
        }

        .grid-cell.empty-slot {
            background: transparent;
            border: none;
            cursor: default;
        }

        .grid-cell.filled {
            background: #1f6feb;
            color: #fff;
            font-weight: bold;
        }

        .grid-cell.correct-slot {
            background: var(--correct-color);
        }

        .feedback-msg {
            margin-top: 15px;
            font-size: 1.1rem;
            font-weight: bold;
            height: 30px;
            text-align: center;
        }

        .msg-correct { color: #3fb950; }
        .msg-wrong { color: #f85149; }

        @media (max-width: 768px) {
            h1 { font-size: 1.4rem; }
            .mode-btn { font-size: 0.8rem; padding: 6px 10px; }
            .question-box { font-size: 1rem; }
        }
    </style>
</head>

// Complete standard grid positions generator for 118 slots
let fullPTableSlots = [];
function generateGridStructure() {
    // Basic mapping for row and column positions
    for (let r = 1; r <= 7; r++) {
        for (let c = 1; c <= 18; c++) {
            // Check empty spots in Standard Periodic Table layout
            if (r === 1 && c > 1 && c < 18) continue;
            if ((r === 2 || r === 3) && c > 2 && c < 13) continue;
            fullPTableSlots.push({ row: r, col: c });
        }
    }
}
generateGridStructure();

// Game State Variables
let currentMode = 1;
let hearts = 5;
let score = 0;
let currentQuestion = null;
let mode1PlacedCount = 0;

// Initialize App
window.onload = () => {
    switchMode(1);
};

function updateStatusBar() {
    const heartString = "❤️".repeat(Math.max(0, hearts)) + "🖤".repeat(Math.max(0, 5 - hearts));
    document.getElementById("hearts-display").textContent = heartString;
    document.getElementById("score").textContent = score;

    if (hearts <= 0) {
        showGameOver();
    }
}

function resetHearts() {
    hearts = 5;
    updateStatusBar();
}

function showGameOver() {
    document.getElementById("question-text").innerHTML = `<span style="color:#f85149; font-size:1.8rem;">💔 GAME OVER!</span><br>คุณหมดหัวใจแล้ว คะแนนรวมของคุณคือ: ${score}`;
    document.getElementById("interactive-area").innerHTML = `
        <button class="submit-btn" style="font-size:1.2rem; padding:12px 24px;" onclick="restartGame()">เริ่มเล่นใหม่</button>
    `;
    document.getElementById("feedback").textContent = "";
}

function restartGame() {
    hearts = 5;
    score = 0;
    updateStatusBar();
    switchMode(currentMode);
}

function switchMode(modeNum) {
    if (hearts <= 0) hearts = 5;
    currentMode = modeNum;
    updateStatusBar();

    document.querySelectorAll(".mode-btn").forEach((btn, idx) => {
        btn.classList.toggle("active", idx + 1 === modeNum);
    });

    document.getElementById("feedback").textContent = "";
    
    switch (modeNum) {
        case 1: initMode1(); break;
        case 2: initMode2(); break;
        case 3: initMode3(); break;
        case 4: initComparisonMode("IE", "พลังงานไอออไนเซชัน (IE)", "ie"); break;
        case 5: initComparisonMode("EN", "อิเล็กโทรเนกาติวิตี (EN)", "en"); break;
        case 6: initComparisonMode("จุดหลอมเหลว", "จุดหลอมเหลว (Melting Point)", "mp"); break;
        case 7: initComparisonMode("EA", "สัมพรรคภาพอิเล็กตรอน (EA)", "ea"); break;
    }
}

function setFeedback(isCorrect, message) {
    const fb = document.getElementById("feedback");
    fb.textContent = message;
    fb.className = "feedback-msg " + (isCorrect ? "msg-correct" : "msg-wrong");

    if (!isCorrect) {
        hearts--;
        updateStatusBar();
    } else {
        score += 10;
        updateStatusBar();
    }
}

// -------------------------------------------------------------
// MODE 1: Interactive Periodic Table Fill (118 Grid Slots)
// -------------------------------------------------------------
function initMode1() {
    const targetElement = elementsDB[Math.floor(Math.random() * elementsDB.length)];
    currentQuestion = targetElement;

    document.getElementById("question-text").innerHTML = 
        `โหมด 1: จงคลิกตำแหน่งของธาตุ <b style="color:var(--accent-color); font-size:1.4rem;">${targetElement.sym} (${targetElement.name})</b> ในตารางธาตุ 118 ช่อง`;

    const area = document.getElementById("interactive-area");
    area.innerHTML = `<div class="table-wrapper"><div class="ptable-grid" id="ptable"></div></div>`;

    const gridContainer = document.getElementById("ptable");

    // Render Periodic Table Grid
    for (let r = 1; r <= 7; r++) {
        for (let c = 1; c <= 18; c++) {
            const isSlot = fullPTableSlots.some(s => s.row === r && s.col === c);
            const cell = document.createElement("div");

            if (!isSlot) {
                cell.className = "grid-cell empty-slot";
            } else {
                cell.className = "grid-cell";
                cell.dataset.row = r;
                cell.dataset.col = c;
                cell.textContent = `${r},${c}`;

                cell.onclick = () => {
                    if (hearts <= 0) return;
                    if (r === targetElement.row && c === targetElement.col) {
                        cell.classList.add("correct-slot");
                        cell.textContent = targetElement.sym;
                        setFeedback(true, `✨ ถูกต้อง! ${targetElement.sym} อยู่ที่ คาบ ${r} หมู่ ${c}`);
                        setTimeout(initMode1, 1500);
                    } else {
                        setFeedback(false, `❌ ผิดตำแหน่ง! ลองใหม่อีกครั้ง`);
                    }
                };
            }
            gridContainer.appendChild(cell);
        }
    }
}

    currentQuestion = el;

    document.getElementById("question-text").innerHTML = 
        `โหมด 2: จงพิมพ์การจัดเรียงอิเล็กตรอนใน<b>ระดับพลังงานหลัก</b> ของธาตุ <b style="color:var(--accent-color);">${el.sym} (${el.name})</b><br><small style="font-size:0.9rem; color:#8b949e;">(ตัวอย่างรูปแบบการตอบ: 2,8,1 หรือ 2,8,8,2)</small>`;

    const area = document.getElementById("interactive-area");
    area.innerHTML = `
        <div class="input-area">
            <input type="text" id="config-input" placeholder="เช่น 2,8,1" autocomplete="off">
            <button class="submit-btn" onclick="checkMode2()">ส่งคำตอบ</button>
        </div>
    `;

    document.getElementById("config-input").addEventListener("keypress", (e) => {
        if (e.key === "Enter") checkMode2();
    });
}

function checkMode2() {
    if (hearts <= 0) return;
    const input = document.getElementById("config-input").value.trim().replace(/\s+/g, '');
    if (input === currentQuestion.shell) {
        setFeedback(true, `✨ เก่งมาก! การจัดเรียงอิเล็กตรอนของ ${currentQuestion.sym} คือ ${currentQuestion.shell}`);
        setTimeout(initMode2, 1500);
    } else {
        setFeedback(false, `❌ ยังไม่ถูกต้อง! (เฉลย: ${currentQuestion.shell})`);
        setTimeout(initMode2, 2000);
    }
}

// -------------------------------------------------------------
// MODE 3: Element Hint / Guess Name or Symbol
// -------------------------------------------------------------
function initMode3() {
    const el = elementsDB[Math.floor(Math.random() * elementsDB.length)];
    currentQuestion = el;

    document.getElementById("question-text").innerHTML = 
        `โหมด 3: ทายชื่อหรือสัญลักษณ์ธาตุจากคำใบ้ต่อไปนี้<br><br><span style="color:#e3b341; font-size:1.3rem;">" ${el.hint} "</span>`;

    const area = document.getElementById("interactive-area");
    area.innerHTML = `
        <div class="input-area">
            <input type="text" id="hint-input" placeholder="พิมพ์ชื่อธาตุภาษาไทย หรือ สัญลักษณ์" autocomplete="off">
            <button class="submit-btn" onclick="checkMode3()">ส่งคำตอบ</button>
        </div>
    `;

    document.getElementById("hint-input").addEventListener("keypress", (e) => {
        if (e.key === "Enter") checkMode3();
    });
}

function checkMode3() {
    if (hearts <= 0) return;
    const input = document.getElementById("hint-input").value.trim().toLowerCase();
    const correctSym = currentQuestion.sym.toLowerCase();
    const correctName = currentQuestion.name.toLowerCase();

    if (input === correctSym || input === correctName) {
        setFeedback(true, `✨ ถูกต้อง! ธาตุนั้นคือ ${currentQuestion.name} (${currentQuestion.sym})`);
        setTimeout(initMode3, 1500);
    } else {
        setFeedback(false, `❌ ผิดครับ! คำตอบที่ถูกต้องคือ ${currentQuestion.name} (${currentQuestion.sym})`);
        setTimeout(initMode3, 2000);
    }
}

// -------------------------------------------------------------
// MODES 4, 5, 6, 7: Comparison Modes (IE, EN, Melting Point, EA)
// -------------------------------------------------------------
function initComparisonMode(propertyNameTh, propertyFullTitle, key) {
    // Pick 2 distinct elements
    let idx1 = Math.floor(Math.random() * elementsDB.length);
    let idx2;
    do {
        idx2 = Math.floor(Math.random() * elementsDB.length);
    } while (idx1 === idx2);

    const el1 = elementsDB[idx1];
    const el2 = elementsDB[idx2];

    const isHigherQuestion = Math.random() > 0.5;
    const targetWord = isHigherQuestion ? "มากที่สุด (สูงที่สุด)" : "น้อยที่สุด (ต่ำที่สุด)";

    currentQuestion = {
        el1, el2, key, isHigherQuestion,
        correctEl: (isHigherQuestion ? (el1[key] >= el2[key] ? el1 : el2) : (el1[key] <= el2[key] ? el1 : el2))
    };

    document.getElementById("question-text").innerHTML = 
        `โหมด ${currentMode}: ธาตุใดมีค่า <b>${propertyFullTitle}</b> <span style="color:#f0883e;">${targetWord}</span>?`;

    const area = document.getElementById("interactive-area");
    area.innerHTML = `
        <div class="options-grid">
            <div class="option-card" onclick="checkComparison('${el1.sym}')">
                <div style="font-size:2rem; font-weight:bold; color:var(--accent-color);">${el1.sym}</div>
                <div>${el1.name}</div>
            </div>
            <div class="option-card" onclick="checkComparison('${el2.sym}')">
                <div style="font-size:2rem; font-weight:bold; color:var(--accent-color);">${el2.sym}</div>
                <div>${el2.name}</div>
            </div>
        </div>
    `;
}

function checkComparison(selectedSym) {
    if (hearts <= 0) return;
    const { el1, el2, key, correctEl } = currentQuestion;

    if (selectedSym === correctEl.sym) {
        setFeedback(true, `✨ ถูกต้อง! (${el1.sym} = ${el1[key]} vs ${el2.sym} = ${el2[key]})`);
    } else {
        setFeedback(false, `❌ ตอบผิด! (${el1.sym} = ${el1[key]} vs ${el2.sym} = ${el2[key]})`);
    }

    setTimeout(() => {
        switchMode(currentMode);
    }, 2000);
}
</script>
</body>
