          <!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เกมเคมีตารางธาตุ - Periodic Table Master</title>
  <style>
    :root {
      --primary: #4f46e5;
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --accent: #10b981;
      --danger: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Kanit', sans-serif, system-ui; }
    body { background-color: var(--bg); color: var(--text); padding: 15px; text-align: center; min-height: 100vh; }
    
    header { margin-bottom: 15px; }
    .hearts { font-size: 1.5rem; color: var(--danger); margin: 10px 0; }
    
    .nav-modes { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 20px; }
    .btn { background: var(--primary); color: white; border: none; padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: 0.9rem; transition: 0.2s; }
    .btn:hover { opacity: 0.9; transform: translateY(-2px); }
    .btn.active { background: var(--accent); font-weight: bold; }

    .game-card { background: var(--card-bg); border-radius: 12px; padding: 20px; max-width: 900px; margin: 0 auto; box-shadow: 0 4px 20px rgba(0,0,0,0.3); }

    /* Mode 1: Table Grid */
    .table-container { overflow-x: auto; padding-bottom: 10px; }
    .periodic-table { display: grid; grid-template-columns: repeat(18, minmax(35px, 1fr)); gap: 4px; min-width: 680px; margin: 15px 0; }
    .slot { border: 1px dashed #475569; aspect-ratio: 1; display: flex; align-items: center; justify-content: center; font-size: 0.75rem; border-radius: 4px; background: rgba(255,255,255,0.02); }
    .slot.filled { border-style: solid; background: var(--primary); font-weight: bold; }
    .drag-deck { display: flex; gap: 10px; justify-content: center; min-height: 50px; margin-top: 15px; flex-wrap: wrap; }
    .drag-item { background: var(--accent); color: white; padding: 8px 16px; border-radius: 6px; cursor: grab; font-weight: bold; user-select: none; }
    .drag-item.selected { outline: 3px solid #f59e0b; }

    /* Comparison & Question Modes */
    .compare-box { display: flex; gap: 15px; justify-content: center; margin: 20px 0; flex-wrap: wrap; }
    .element-card { background: #334155; padding: 25px; border-radius: 10px; width: 140px; cursor: pointer; transition: 0.2s; border: 2px solid transparent; }
    .element-card:hover { border-color: var(--accent); transform: scale(1.05); }
    .symbol { font-size: 2rem; font-weight: bold; color: #38bdf8; }

    input[type="text"] { padding: 10px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: white; margin-right: 8px; width: 60%; max-width: 300px; }
    
    .msg { margin-top: 15px; font-weight: bold; min-height: 24px; }
  </style>
</head>
<body>

  <header>
    <h1>🧪 Periodic Table Master</h1>
    <div class="hearts" id="hearts">❤️❤️❤️❤️❤️</div>
  </header>

  <div class="nav-modes">
    <button class="btn active" onclick="switchMode(1)">1. จัดวางตารางธาตุ</button>
    <button class="btn" onclick="switchMode(2)">2. จัดเรียง e⁻</button>
    <button class="btn" onclick="switchMode(3)">3. คำใบ้ธาตุ</button>
    <button class="btn" onclick="switchMode(4)">4. เปรียบเทียบ IE</button>
    <button class="btn" onclick="switchMode(5)">5. เปรียบเทียบ EN</button>
    <button class="btn" onclick="switchMode(6)">6. จุดหลอมเหลว</button>
    <button class="btn" onclick="switchMode(7)">7. เปรียบเทียบ EA</button>
  </div>

  <div class="game-card" id="game-area">
    <!-- Game Content Injected via JS -->
  </div>

  <script>
    // Database ธาตุตัวอย่างสำหรับระบบเกม (ขยายข้อมูลได้ตามต้องการ)
    const elementsData = [
      { z: 1, sym: "H", name: "Hydrogen", e: "1", ie: 1312, en: 2.20, mp: 14.01, ea: 73 },
      { z: 2, sym: "He", name: "Helium", e: "2", ie: 2372, en: 0, mp: 0.95, ea: 0 },
      { z: 3, sym: "Li", name: "Lithium", e: "2,1", ie: 520, en: 0.98, mp: 453.65, ea: 60 },
      { z: 4, sym: "Be", name: "Beryllium", e: "2,2", ie: 899, en: 1.57, mp: 1560, ea: 0 },
      { z: 5, sym: "B", name: "Boron", e: "2,3", ie: 801, en: 2.04, mp: 2349, ea: 27 },
      { z: 6, sym: "C", name: "Carbon", e: "2,4", ie: 1086, en: 2.55, mp: 3823, ea: 122 },
      { z: 7, sym: "N", name: "Nitrogen", e: "2,5", ie: 1402, en: 3.04, mp: 63.15, ea: 7 },
      { z: 8, sym: "O", name: "Oxygen", e: "2,6", ie: 1314, en: 3.44, mp: 54.36, ea: 141 },
      { z: 9, sym: "F", name: "Fluorine", e: "2,7", ie: 1681, en: 3.98, mp: 53.53, ea: 328 },
      { z: 10, sym: "Ne", name: "Neon", e: "2,8", ie: 2080, en: 0, mp: 24.56, ea: 0 },
      { z: 11, sym: "Na", name: "Sodium", e: "2,8,1", ie: 496, en: 0.93, mp: 370.87, ea: 53 },
      { z: 12, sym: "Mg", name: "Magnesium", e: "2,8,2", ie: 738, en: 1.31, mp: 923, ea: 0 },
      { z: 17, sym: "Cl", name: "Chlorine", e: "2,8,7", ie: 1251, en: 3.16, mp: 171.6, ea: 349 },
      { z: 18, sym: "Ar", name: "Argon", e: "2,8,8", ie: 1520, en: 0, mp: 83.80, ea: 0 },
      { z: 19, sym: "K", name: "Potassium", e: "2,8,8,1", ie: 419, en: 0.82, mp: 336.53, ea: 48 },
      { z: 35, sym: "Br", name: "Bromine", e: "2,8,18,7", ie: 1140, en: 2.96, mp: 265.8, ea: 325 }
    ];

    let currentMode = 1;
    let hearts = 5;
    let selectedElement = null; // สำหรับ Tap-to-place บนมือถือ

    function updateHearts() {
      const container = document.getElementById('hearts');
      container.innerHTML = '❤️'.repeat(hearts) + '🖤'.repeat(5 - hearts);
      if (hearts <= 0) {
        alert("Game Over! หัวใจหมดแล้ว ระบบจะรีเซ็ตเกมใหม่");
        hearts = 5;
        updateHearts();
        switchMode(currentMode);
      }
    }

    function wrongAnswer(msg = "ตอบผิด! หักหัวใจ 1 ดวง") {
      hearts--;
      updateHearts();
      showMsg(msg, 'var(--danger)');
    }

    function showMsg(text, color = 'var(--accent)') {
      const msgDiv = document.getElementById('msg');
      if(msgDiv) {
        msgDiv.innerText = text;
        msgDiv.style.color = color;
      }
    }

    function switchMode(mode) {
      currentMode = mode;
      selectedElement = null;
      document.querySelectorAll('.nav-modes .btn').forEach((btn, idx) => {
        btn.classList.toggle('active', idx + 1 === mode);
      });
      renderGame();
    }

    function getRandomElements(count = 2) {
      let shuffled = [...elementsData].sort(() => 0.5 - Math.random());
      return shuffled.slice(0, count);
    }

    function renderGame() {
      const area = document.getElementById('game-area');
      
      if (currentMode === 1) {
        // Mode 1: Drag & Drop / Tap to Place
        let deck = getRandomElements(Math.min(5, elementsData.length));
        area.innerHTML = `
          <h2>โหมดที่ 1: จัดวางธาตุลงในตาราง (รองรับการแตะเลือกบนมือถือ)</h2>
          <p>เลือก/ลากธาตุจากด้านล่างไปใส่ตำแหน่ง เลขอะตอม (Z) ที่ถูกต้อง</p>
          <div class="table-container">
            <div class="periodic-table">
              ${Array.from({length: 18}, (_, i) => {
                let z = i + 1;
                return `<div class="slot" data-z="${z}" onclick="placeSlot(${z})">Z:${z}</div>`;
              }).join('')}
            </div>
          </div>
          <div class="drag-deck" id="deck">
            ${deck.map(el => `
              <div class="drag-item" draggable="true" ondragstart="drag(event, ${el.z})" onclick="selectCard(this, ${el.z})">
                ${el.sym} (${el.z})
              </div>
            `).join('')}
          </div>
          <div class="msg" id="msg"></div>
        `;
      } 
      else if (currentMode === 2) {
        // Mode 2: Electron Configuration
        let target = getRandomElements(1)[0];
        area.innerHTML = `
          <h2>โหมดที่ 2: จัดเรียงพลังงานอิเล็กตรอนหลัก</h2>
          <p>ธาตุ: <strong class="symbol">${target.sym}</strong> (เลขอะตอม ${target.z})</p>
          <p style="margin:10px 0;">ให้พิมพ์การจัดเรียง e⁻ เช่น: 2,8,1</p>
          <input type="text" id="eInput" placeholder="เช่น 2,8,1">
          <button class="btn" onclick="checkE('${target.e}')">ส่งคำตอบ</button>
          <div class="msg" id="msg"></div>
        `;
      } 
      else if (currentMode === 3) {
        // Mode 3: Clue Guessing
        let target = getRandomElements(1)[0];
        area.innerHTML = `
          <h2>โหมดที่ 3: ถอดรหัสคำใบ้ธาตุ</h2>
          <p style="margin:15px 0; font-style:italic;">คำใบ้: "ธาตุที่มีเลขอะตอมเท่ากับ ${target.z} และมีสัญลักษณ์คือ '${target.sym}'"</p>
          <input type="text" id="nameInput" placeholder="พิมพ์ชื่อภาษาอังกฤษ เช่น Hydrogen">
          <button class="btn" onclick="checkName('${target.name}')">ส่งคำตอบ</button>
          <div class="msg" id="msg"></div>
        `;
      }
      else if ([4, 5, 6, 7].includes(currentMode)) {
        // Modes 4-7: Property Comparison
        let pair = getRandomElements(2);
        let props = { 4: { key: 'ie', title: 'ค่าพลังงานไอออไนเซชัน (IE)' },
                      5: { key: 'en', title: 'ค่าอิเล็กโตรเนกาติวิตี (EN)' },
                      6: { key: 'mp', title: 'จุดหลอมเหลว (Melting Point)' },
                      7: { key: 'ea', title: 'ค่าสัมพรรคภาพอิเล็กตรอน (EA)' } };
        let currentProp = props[currentMode];
        
        area.innerHTML = `
          <h2>โหมดที่ ${currentMode}: เปรียบเทียบ ${currentProp.title}</h2>
          <p>ธาตุใดมีค่า <strong>${currentProp.title} มากกว่ากัน?</strong></p>
          <div class="compare-box">
            <div class="element-card" onclick="checkCompare(${pair[0][currentProp.key]}, ${pair[1][currentProp.key]})">
              <div class="symbol">${pair[0].sym}</div>
              <div>${pair[0].name}</div>
            </div>
            <div class="element-card" onclick="checkCompare(${pair[1][currentProp.key]}, ${pair[0][currentProp.key]})">
              <div class="symbol">${pair[1].sym}</div>
              <div>${pair[1].name}</div>
            </div>
          </div>
          <div class="msg" id="msg"></div>
        `;
      }
    }

    // Handlers for Mode 1
    function selectCard(el, z) {
      document.querySelectorAll('.drag-item').forEach(card => card.classList.remove('selected'));
      selectedElement = z;
      el.classList.add('selected');
      showMsg(`เลือกธาตุ Z:${z} แล้ว - ให้แตะช่องในตารางเพื่อวาง`);
    }

    function placeSlot(targetZ) {
      if (!selectedElement) return;
      if (selectedElement === targetZ) {
        showMsg("ถูกต้อง! วางธาตุเรียบร้อย", 'var(--accent)');
        let slot = document.querySelector(`.slot[data-z="${targetZ}"]`);
        let elData = elementsData.find(e => e.z === targetZ);
        slot.classList.add('filled');
        slot.innerText = elData.sym;
        selectedElement = null;
        setTimeout(renderGame, 1000);
      } else {
        wrongAnswer(`ผิดตำแหน่ง! นั่นไม่ใช่ช่องของ Z:${selectedElement}`);
      }
    }

    function drag(ev, z) { ev.dataTransfer.setData("text", z); }

    // Handlers for Mode 2 & 3
    function checkE(correct) {
      let val = document.getElementById('eInput').value.trim();
      if (val === correct) {
        showMsg("ถูกต้องแม่นยำ!", 'var(--accent)');
        setTimeout(renderGame, 1200);
      } else {
        wrongAnswer(`ผิด! คำตอบที่ถูกต้องคือ ${correct}`);
      }
    }

    function checkName(correct) {
      let val = document.getElementById('nameInput').value.trim().toLowerCase();
      if (val === correct.toLowerCase()) {
        showMsg("ถูกต้อง!", 'var(--accent)');
        setTimeout(renderGame, 1200);
      } else {
        wrongAnswer(`ตอบผิด! ชื่อที่ถูกต้องคือ ${correct}`);
      }
    }

    // Handler for Modes 4-7
    function checkCompare(val1, val2) {
      if (val1 >= val2) {
        showMsg("ถูกต้อง! คุณเลือกธาตุที่มีค่าสูงกว่า", 'var(--accent)');
        setTimeout(renderGame, 1200);
      } else {
        wrongAnswer("ผิด! ธาตุนี้มีค่าน้อยกว่า");
      }
    }

    // Init
    renderGame();
  </script>
</body>
</html>
